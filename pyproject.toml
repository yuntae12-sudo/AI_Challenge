[project]
name = "V-Max"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "distrax>=0.1.9",
    "einops>=0.8.2",
    "gymnasium>=1.3.0",
    "hydra-core>=1.3.4",
    "jax[cuda13]>=0.11.0",
    "pandas>=3.0.5",
    "tensorboard>=2.21.0",
    "tensorboardx>=2.6.5",
    "tensorflow-cpu>=2.21.0",
    "tf-keras>=2.21.0",
    "waymo-waymax",
]

[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "."
module-name = "vmax"

[tool.uv]
# Prevent installing the GPU/monolithic TensorFlow package pulled by waymo-waymax.
exclude-dependencies = ["tensorflow"]

[tool.uv.sources]
# waymo-waymax = { git = "https://github.com/waymo-research/waymax.git", rev = "main" }
waymo-waymax = { git = "https://github.com/waymo-research/waymax.git", rev = "a64dfec9be8576b60d9cecc94f406d9812d4a7d0" }

[tool.pyright]
venvPath = "."
venv = ".venv"
